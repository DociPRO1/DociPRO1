# Pull requests: typecheck, build from the committed data snapshot (no
# network, no token), and validate. Read-only, never commits.
name: verify

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build:offline
      - run: npm run check
      - name: Generated files are up to date
        run: git diff --exit-code -- README.md assets || (echo "::error::Run 'npm run build:offline' and commit the result." && exit 1)
